services:
  - type: web
    name: xtream-mac-to-m3u
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 180 --workers 2
    envVars:
      - key: ACCESS_KEY
        sync: false   # set in the Render dashboard (recommended)
      - key: XTREAM_URL
        sync: false   # optional: http://host:port  (short links)
